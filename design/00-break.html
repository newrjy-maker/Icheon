<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이천 모험지도 · 도자기 조각 맛보기</title>
  <style>
    :root{--night:#071720;--mint:#73e0d7;--orange:#ff843d;--gold:#ffc52b;--white:#fffdf5;--ink:#f7ffff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102026;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}.phone{position:relative;width:min(100%,430px);height:100svh;min-height:820px;max-height:932px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a5559,#0c2930 36%,var(--night) 76%)}
    header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 20px}.brand{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid rgba(115,224,215,.44);border-radius:99px;color:var(--mint);font-size:12px;font-weight:900}.brand i{width:8px;height:8px;border-radius:50%;background:var(--orange)}.skip{color:#d8e6e7;font-size:13px;font-weight:900;text-decoration:none}
    .copy{position:relative;z-index:4;padding:36px 24px 0;text-align:center}.copy span{display:inline-block;padding:6px 10px;border-radius:99px;background:rgba(115,224,215,.12);color:var(--mint);font-size:12px;font-weight:900}.copy h1{margin:10px 0 0;font-size:27px;line-height:1.25;letter-spacing:-.8px}.copy h1 b{color:#ffd966}
    .stage{position:relative;height:470px;margin-top:0}.burst{position:absolute;left:50%;top:40%;width:360px;height:360px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,197,43,.24) 0 5deg,transparent 5deg 18deg);mask-image:radial-gradient(circle,transparent 0 23%,#000 40%,transparent 72%);transform:translate(-50%,-50%);animation:burst .7s .2s both}@keyframes burst{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    .jar{position:absolute;left:50%;top:39%;width:220px;height:270px;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 19px rgba(0,0,0,.32))}.jar svg{width:100%;height:100%;overflow:visible}.whole{animation:whole .75s .15s both}@keyframes whole{0%,38%{opacity:1}100%{opacity:0}}.crack{stroke:#ffbd2e;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ffaf1c);stroke-dasharray:120;animation:crack .42s .12s both}@keyframes crack{from{stroke-dashoffset:120;opacity:0}to{stroke-dashoffset:0;opacity:1}}
    .shard{display:none}.html-shard{position:absolute;z-index:4;width:96px;height:130px;border-radius:45px;background:radial-gradient(circle at 30% 20%,#fff,#fffbed 52%,#c7dddd);filter:drop-shadow(0 0 4px #ffc52b) drop-shadow(0 12px 10px rgba(0,0,0,.25));opacity:0;animation-duration:1.3s;animation-delay:.43s;animation-timing-function:cubic-bezier(.18,.84,.25,1);animation-fill-mode:both}.html-shard::after{content:"✦";position:absolute;color:#ffc52b;font-size:18px}.hs1{left:149px;top:82px;clip-path:polygon(0 0,100% 0,72% 42%,89% 100%,0 83%);animation-name:hs1}.hs1::after{left:20px;top:48px}.hs2{left:206px;top:86px;clip-path:polygon(18% 0,100% 0,100% 79%,31% 100%,0 42%);animation-name:hs2}.hs2::after{right:18px;top:33px}.hs3{left:169px;top:169px;width:113px;height:101px;clip-path:polygon(0 9%,48% 0,100% 28%,81% 100%,17% 100%);animation-name:hs3}.hs3::after{left:48px;top:44px}@keyframes hs1{0%{opacity:0;transform:translate(0) rotate(0) scale(.8)}18%,60%{opacity:1;transform:translate(-78px,-28px) rotate(-19deg) scale(1)}100%{opacity:0;transform:translate(-107px,226px) rotate(-34deg) scale(.42)}}@keyframes hs2{0%{opacity:0;transform:translate(0) rotate(0) scale(.8)}18%,60%{opacity:1;transform:translate(79px,-20px) rotate(21deg) scale(1)}100%{opacity:0;transform:translate(82px,223px) rotate(36deg) scale(.42)}}@keyframes hs3{0%{opacity:0;transform:translate(0) rotate(0) scale(.8)}18%,60%{opacity:1;transform:translate(5px,69px) rotate(7deg) scale(1)}100%{opacity:0;transform:translate(3px,180px) rotate(14deg) scale(.42)}}
    .spark{position:absolute;width:12px;height:12px;background:#fff0a8;clip-path:polygon(50% 0,61% 37%,100% 50%,61% 63%,50% 100%,39% 63%,0 50%,39% 37%);filter:drop-shadow(0 0 6px #ff9e1f);opacity:0;animation:spark .9s .34s ease-out both}.s1{left:17%;top:26%}.s2{right:17%;top:31%;width:18px;height:18px}.s3{left:27%;top:49%}.s4{right:29%;top:19%}@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1}100%{opacity:.2;transform:scale(1.7) rotate(70deg) translateY(-20px)}}
    .tray{position:absolute;z-index:4;left:24px;right:24px;bottom:10px;padding:15px;border:1px solid rgba(115,224,215,.34);border-radius:22px;background:rgba(7,23,32,.76);box-shadow:0 12px 28px rgba(0,0,0,.22);backdrop-filter:blur(10px)}.tray-head{display:flex;align-items:center;justify-content:space-between}.tray-head b{font-size:16px}.counter{padding:5px 8px;border-radius:99px;background:#18343a;color:var(--mint);font-size:12px;font-weight:900}.homes{display:flex;justify-content:center;gap:14px;margin-top:12px}.home{position:relative;display:grid;place-items:center;width:66px;height:66px;border:2px dashed #6f8a8e;border-radius:19px;background:#10262c;color:#789095;font-size:22px}.home::after{content:"";position:absolute;inset:7px;border-radius:13px;background:linear-gradient(145deg,#fff9d7,#f2be39);opacity:0;transform:scale(.3);animation:land .35s forwards}.home:nth-child(1)::after{animation-delay:1.38s}.home:nth-child(2)::after{animation-delay:1.55s}.home:nth-child(3)::after{animation-delay:1.7s}@keyframes land{to{opacity:1;transform:scale(1)}}.home span{position:relative;z-index:2;opacity:1;animation:number .2s forwards}.home:nth-child(1) span{animation-delay:1.38s}.home:nth-child(2) span{animation-delay:1.55s}.home:nth-child(3) span{animation-delay:1.7s}@keyframes number{to{color:#754900}}
    .finish{position:absolute;z-index:7;left:24px;right:24px;bottom:25px;text-align:center;opacity:0;transform:translateY(18px);animation:finish .35s 1.78s forwards}@keyframes finish{to{opacity:1;transform:none}}.finish h2{margin:0 0 5px;font-size:22px}.finish p{margin:0 0 13px;color:#b6cbcc;font-size:14px;font-weight:700}.finish a{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;background:linear-gradient(100deg,#19aaa2,#71ded6);color:#fff;text-decoration:none;font-size:17px;font-weight:900;box-shadow:0 9px 20px rgba(25,170,162,.22)}
    .capture .whole{opacity:0;animation:none}.capture .crack{opacity:1;stroke-dashoffset:0;animation:none}.capture .html-shard{opacity:1;animation:none}.capture .hs1{transform:translate(-78px,-28px) rotate(-19deg)}.capture .hs2{transform:translate(79px,-20px) rotate(21deg)}.capture .hs3{transform:translate(5px,69px) rotate(7deg)}
    @media(max-height:860px){.copy{padding-top:12px}.stage{height:430px}.finish{bottom:14px}}
  </style>
</head>
<body>
<main class="phone" aria-label="백자 달항아리가 세 개의 퍼즐 조각으로 나뉘는 맛보기 연출">
  <header><div class="brand"><i></i>이천 모험지도 · PIECE 체험</div><a class="skip" href="00-profile.html">건너뛰기</a></header>
  <section class="copy"><span>2초 맛보기</span><h1>하나의 도자기가<br/><b>세 조각의 여행</b>이 됩니다</h1></section>
  <section class="stage"><div class="burst"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
    <div class="jar"><svg viewBox="0 0 250 300" aria-hidden="true"><defs><radialGradient id="body" cx="35%" cy="24%"><stop stop-color="#fff"/><stop offset=".55" stop-color="#fffdf1"/><stop offset="1" stop-color="#cbdedd"/></radialGradient></defs><g class="whole"><path d="M88 35c4 18-3 32-21 50-28 28-39 72-27 115 12 44 45 69 85 69s73-25 85-69c12-43 1-87-27-115-18-18-25-32-21-50Z" fill="url(#body)" stroke="#fff" stroke-width="4"/><ellipse cx="125" cy="37" rx="38" ry="13" fill="#d3e6e2"/></g><path class="crack" d="M143 45 122 110l39 58-85 10"/></svg></div><i class="html-shard hs1"></i><i class="html-shard hs2"></i><i class="html-shard hs3"></i>
    <div class="tray"><div class="tray-head"><b>빈 퍼즐 홈</b><span class="counter">맛보기 · 0/3 → 3/3</span></div><div class="homes"><div class="home"><span>1</span></div><div class="home"><span>2</span></div><div class="home"><span>3</span></div></div></div>
  </section>
  <section class="finish"><h2>조각을 모아 지도를 완성하세요</h2><p>실제 여행에서는 현장 QR 한 곳당 한 조각을 얻어요.</p><a href="00-profile.html">아이디 만들고 탐험 시작 →</a></section>
</main>
<script>if(new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');</script>
</body>
</html>
