<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이천 모험지도 · 현장 QR 인증</title>
  <style>
    :root{--ink:#17343b;--muted:#61767c;--teal:#18aaa2;--mint:#75ddd4;--orange:#ff843d;--cream:#fbfaf6;--line:#e8e2d8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d9e9ed;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}button{font:inherit}.phone{position:relative;width:min(100%,430px);height:100svh;min-height:820px;max-height:998px;margin:auto;overflow:hidden;background:var(--cream)}
    header{display:grid;grid-template-columns:48px 1fr auto;align-items:center;height:62px;padding:0 14px;border-bottom:1px solid #eee9e1;background:#fff}.back{display:grid;place-items:center;width:48px;height:48px;border:0;background:transparent;color:#066c68;font-size:29px}.title{font-size:19px;font-weight:900}.place{display:flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid #ece6dd;border-radius:99px;background:#fbfaf6;color:#076d69;font-size:12px;font-weight:900}
    .content{height:calc(100% - 82px);overflow-y:auto;padding:13px 20px 92px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.status{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.piece{padding:7px 11px;border:1px solid #ffb986;border-radius:99px;background:#fff0e5;color:#a44a0a;font-size:13px;font-weight:900}.camera-label{color:#829095;font-size:12px;font-weight:800}
    .camera{position:relative;height:385px;overflow:hidden;border-radius:22px;background:linear-gradient(#83b7cb 0 30%,#8eb881 30% 58%,#417887 58%);box-shadow:0 7px 18px rgba(31,67,74,.18)}.camera svg.scene{position:absolute;inset:0;width:100%;height:100%}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.2))}.flashlight{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.88);font-size:19px}.finder{position:absolute;left:44px;right:44px;top:66px;height:258px;border:3px solid var(--mint);border-radius:12px;box-shadow:0 0 16px rgba(117,221,212,.45)}.finder::before,.finder::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.finder::before{width:116px;height:116px;border:1px dashed rgba(255,255,255,.75)}.finder::after{width:31px;height:31px;background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 7px),repeating-linear-gradient(#fff 0 4px,transparent 4px 7px);opacity:.72}.scanline{position:absolute;left:3px;right:3px;top:14px;height:2px;background:linear-gradient(90deg,transparent,#fff,var(--mint),#fff,transparent);box-shadow:0 0 8px var(--mint);animation:scan 2.4s ease-in-out infinite}@keyframes scan{50%{top:238px}}.guide{position:absolute;left:42px;right:42px;bottom:48px;padding:8px;border-radius:9px;background:rgba(15,30,35,.78);color:#fff;text-align:center;font-size:12px;font-weight:900}
    .camera-help{margin:9px 7px 14px;text-align:center;color:#6d7d81;font-size:12px;line-height:1.45}.camera-help b{color:#087a73}.info{display:flex;align-items:center;gap:11px;margin-bottom:12px;padding:12px;border:1px solid #a5e9e3;border-radius:17px;background:#ddf8f5;color:#256068}.info i{display:grid;place-items:center;flex:0 0 40px;height:40px;border-radius:50%;background:#087a73;color:#fff;font-style:normal}.info p{margin:0;font-size:12px;font-weight:800;line-height:1.45}.info b{color:#075f5b}.auto{margin-left:auto;color:#076d69;font-size:11px;font-weight:900;white-space:nowrap}
    .place-picker{margin-bottom:12px;padding:13px;border:1px solid #dfe8e6;border-radius:17px;background:#fff;box-shadow:0 5px 13px rgba(42,64,68,.05)}.picker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.picker-head h2{margin:0;font-size:15px}.picker-head span{padding:4px 7px;border-radius:99px;background:#e3f7f3;color:#08726c;font-size:10px;font-weight:900}.spot-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.spot-choice{min-height:67px;padding:7px 4px;border:1px solid #d8e5e3;border-radius:12px;background:#f9fbfb;color:#50686e;font-size:10px;font-weight:900;cursor:pointer}.spot-choice i{display:grid;place-items:center;width:22px;height:22px;margin:0 auto 4px;border-radius:8px;background:#edf5f4;color:#087a73;font-style:normal;font-size:12px}.spot-choice small{display:block;margin-top:2px;color:#a04d0e;font-size:8px;font-weight:900}.spot-choice.final{border-color:#f4ba55;background:#fff8dc}.spot-choice.selected{border:2px solid var(--teal);background:#e8fbf8;color:#075f5b;box-shadow:0 0 0 2px rgba(24,170,162,.1)}.spot-choice.selected i{background:var(--teal);color:#fff}
    .quest,.help{padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 5px 13px rgba(42,64,68,.05)}.quest-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee8df;padding-bottom:10px}.quest h2{display:flex;align-items:center;gap:7px;margin:0;font-size:17px}.quest h2 i{width:9px;height:9px;border-radius:50%;background:var(--orange)}.quest-head span{padding:5px 8px;border-radius:99px;background:#ddf7f3;color:#08726c;font-size:11px;font-weight:900}.mission{display:flex;gap:10px;padding-top:11px}.mission i{color:#087a73;font-style:normal;font-size:18px}.mission small{display:block;color:#788a8e;font-size:11px;font-weight:800}.mission p{margin:3px 0 0;font-size:14px;font-weight:900;line-height:1.45}.help{display:flex;align-items:center;gap:10px;margin-top:12px}.help i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ddf8f5;color:#087a73;font-style:normal}.help p{margin:0;font-size:13px;font-weight:900}.help small{display:block;color:#89989b;font-weight:700}.help button{margin-left:auto;height:38px;padding:0 11px;border:1px solid #e3e0d8;border-radius:99px;background:#fff;color:#087a73;font-size:12px;font-weight:900}
    .bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 18px;border-top:1px solid #eae4da;background:rgba(255,255,255,.96)}.primary{width:100%;height:54px;border:0;border-radius:16px;background:var(--teal);color:#fff;font-size:16px;font-weight:900;box-shadow:0 6px 13px rgba(24,170,162,.22)}
    @media(max-height:900px){.camera{height:330px}.finder{height:218px}.scanline{animation-name:scanSmall}@keyframes scanSmall{50%{top:198px}}.content{padding-top:9px}.camera-help{margin-bottom:9px}.help{display:none}}
  </style>
</head>
<body>
<main class="phone" aria-label="현장 QR 인증 화면">
  <header><button class="back" onclick="location.href='01-home-hub.html'" aria-label="모험지도로 돌아가기">‹</button><div class="title">현장 QR 인증</div><span class="place">⚑ 도자 예술맵</span></header>
  <div class="content"><div class="status"><span class="piece" id="progressChip">☆ 도자 예술맵 0 / 3</span><span class="camera-label">▣ 실시간 카메라</span></div>
    <section class="camera" aria-label="QR 카메라 미리보기"><svg class="scene" viewBox="0 0 390 385" aria-hidden="true"><rect width="390" height="385" fill="#8bbbd0"/><circle cx="327" cy="56" r="33" fill="#dce9d0" opacity=".7"/><path d="M0 159 72 99l58 50 67-76 75 75 61-51 57 55v233H0Z" fill="#668f73"/><path d="M0 212 83 149l55 42 79-60 76 45 97-42v251H0Z" fill="#4f785e"/><ellipse cx="198" cy="305" rx="210" ry="88" fill="#477e8d"/><ellipse cx="203" cy="310" rx="126" ry="41" fill="#7fb1b4" opacity=".45"/><g transform="translate(93 113)"><path d="m0 62 102-58 102 58-102 34Z" fill="#2e5a51"/><path d="m18 61 84-46 84 46-84 26Z" fill="#b8523b"/><path d="M42 65v111h120V65" fill="#a76145"/><path d="M60 78h26v72H60zm58 0h26v72h-26z" fill="#d7c69d"/><path d="M91 66h23v110H91" fill="#53362d"/><path d="M30 176h145" stroke="#d6b981" stroke-width="8"/></g><path d="M0 290c55-14 91 14 142 0s88-3 122 9 76-14 126-8" fill="none" stroke="#d7ece8" stroke-width="3" opacity=".55"/></svg><div class="shade"></div><button class="flashlight" aria-label="플래시">◫</button><div class="finder"><i class="scanline"></i></div><div class="guide">안내판 QR을 네모 안에 맞춰주세요</div></section>
    <p class="camera-help"><b>선택한 장소</b>의 현장 안내판 QR 코드를 화면 사각형 안에 맞춰주세요.</p>
    <aside class="info"><i>✹</i><p><b>현재 맵의 모든 장소 인증 가능</b><br/>세 곳 중 어느 장소부터 인증해도 조각과 진행도가 즉시 갱신됩니다.</p><span class="auto">순서 잠금 없음</span></aside>
    <section class="place-picker" aria-label="인증할 장소 선택"><div class="picker-head"><h2>인증할 장소 선택</h2><span>3곳 모두 가능</span></div><div class="spot-list"><button class="spot-choice" type="button" data-id="yespark" data-name="예스파크" data-mission="도자기 골목에서 달항아리 모양 표지판 찾기"><i>1</i>예스파크</button><button class="spot-choice selected" type="button" data-id="sagimak" data-name="사기막골도예촌" data-mission="전통 가마 입구에 숨은 도자기 흙도장 문양 찾기"><i>2</i>사기막골<br/>도예촌</button><button class="spot-choice" type="button" data-id="ceramic-center" data-name="이천세계도자센터" data-mission="전시장 입구에서 세 가지 도자기 색을 찾아보기"><i>3</i>세계도자<br/>센터</button></div></section>
    <section class="quest"><div class="quest-head"><h2><i></i><span id="spotName">사기막골도예촌</span></h2><span>현장 퀘스트</span></div><div class="mission"><i>◉</i><div><small>미션 목표</small><p id="missionText">전통 가마 입구에 숨은 도자기 흙도장 문양 찾기</p></div></div></section>
    <section class="help"><i>?</i><p>인식이 잘 안 되거나 다른 장소인가요?<small>순서 확인 및 친절한 안내 가이드</small></p><button>안내 보기 ›</button></section>
  </div>
  <div class="bottom"><button class="primary" id="scanButton" type="button">▣ 카메라 켜고 QR 스캔</button></div>
</main>
<script>
  let completed;try{completed=new Set(JSON.parse(localStorage.getItem('icheonCeramicSpots')||'[]'))}catch{completed=new Set()}
  let selected;const spotName=document.querySelector('#spotName');const missionText=document.querySelector('#missionText');const scanButton=document.querySelector('#scanButton');const progressChip=document.querySelector('#progressChip');
  function select(button){document.querySelectorAll('.spot-choice').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');selected={id:button.dataset.id,name:button.dataset.name,mission:button.dataset.mission};spotName.textContent=selected.name;missionText.textContent=selected.mission;const last=completed.size===2&&!completed.has(selected.id);scanButton.textContent=last?'✦ 마지막 장소 QR 스캔 · 지도 완성':'▣ 선택한 장소 QR 스캔';}
  document.querySelectorAll('.spot-choice').forEach(button=>{if(completed.has(button.dataset.id)){button.disabled=true;button.innerHTML='<i>✓</i>완료';}button.addEventListener('click',()=>select(button));});
  progressChip.textContent='☆ 도자 예술맵 '+completed.size+' / 3';
  select([...document.querySelectorAll('.spot-choice')].find(button=>!button.disabled));
  document.querySelector('#scanButton').addEventListener('click',()=>{location.href='02-qr-complete.html?spot='+encodeURIComponent(selected.name)+'&spotId='+encodeURIComponent(selected.id);});
</script>
<script>
  const liveCamera=document.querySelector('.camera'),cameraPreview=document.createElement('video'),cameraNotice=document.createElement('div'),qrPayloads={yespark:'ICHEON-ADVENTURE:ceramic:yespark:V1',sagimak:'ICHEON-ADVENTURE:ceramic:sagimak:V1','ceramic-center':'ICHEON-ADVENTURE:ceramic:ceramic-center:V1'};let cameraStream,qrDetector,qrScanning=false;
  document.head.insertAdjacentHTML('beforeend','<style>.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#173d49}.camera.is-live .scene{display:none}.camera-state{position:absolute;z-index:5;left:50%;top:50%;width:84%;padding:12px;border-radius:14px;background:rgba(9,29,34,.82);color:#fff;text-align:center;font-size:13px;font-weight:900;line-height:1.45;transform:translate(-50%,-50%)}.camera-state b{display:block;margin-bottom:3px;color:#75ddd4}.camera.is-live .camera-state{display:none}.primary:disabled{background:#86989b;color:#edf3f2;box-shadow:none;cursor:not-allowed}</style>');cameraPreview.autoplay=true;cameraPreview.muted=true;cameraPreview.playsInline=true;cameraPreview.setAttribute('aria-label','QR 카메라 미리보기');cameraNotice.className='camera-state';liveCamera.prepend(cameraPreview);liveCamera.append(cameraNotice);
  const showCameraNotice=(title,copy)=>cameraNotice.innerHTML='<b>'+title+'</b>'+copy;
  const stopLiveCamera=()=>{qrScanning=false;if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}cameraPreview.srcObject=null;liveCamera.classList.remove('is-live');};
  const acceptQr=(rawValue)=>{const spotId=Object.keys(qrPayloads).find(id=>qrPayloads[id]===String(rawValue).trim());if(!spotId){showCameraNotice('이천 모험지도 QR이 아니에요','현장 안내판의 QR을 다시 맞춰주세요.');return;}if(completed.has(spotId)){showCameraNotice('이미 완료한 장소예요','아직 완료하지 않은 다른 장소의 QR을 스캔해주세요.');return;}select(document.querySelector('[data-id="'+spotId+'"]'));const proof={nonce:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),map:'ceramic',spotId,spotName:selected.name,expiresAt:Date.now()+60000};sessionStorage.setItem('icheonQrProof',JSON.stringify(proof));stopLiveCamera();location.href='02-qr-complete.html?spot='+encodeURIComponent(proof.spotName)+'&spotId='+encodeURIComponent(proof.spotId)+'&proof='+encodeURIComponent(proof.nonce);};
  const detectQr=async()=>{if(!qrScanning)return;try{const codes=await qrDetector.detect(cameraPreview);if(codes[0]?.rawValue){acceptQr(codes[0].rawValue);return;}}catch{}if(qrScanning)requestAnimationFrame(detectQr);};
  const startLiveCamera=async()=>{if(cameraStream)return;if(!navigator.mediaDevices?.getUserMedia){showCameraNotice('이 기기에서는 카메라를 사용할 수 없어요','HTTPS로 접속한 최신 Chrome 또는 Safari에서 다시 시도해주세요.');return;}if(!('BarcodeDetector' in window)){showCameraNotice('QR 인식을 지원하지 않는 브라우저예요','최신 Android Chrome에서 다시 열어주세요. 인증 완료는 허용되지 않습니다.');return;}scanButton.disabled=true;scanButton.textContent='카메라 권한 요청 중…';try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});cameraPreview.srcObject=cameraStream;await cameraPreview.play();qrDetector=new BarcodeDetector({formats:['qr_code']});qrScanning=true;liveCamera.classList.add('is-live');scanButton.textContent='⌁ 카메라로 QR 인식 중…';requestAnimationFrame(detectQr);}catch(error){const denied=error?.name==='NotAllowedError';showCameraNotice(denied?'카메라 권한이 필요해요':'카메라를 시작하지 못했어요',denied?'브라우저 주소창의 카메라 권한을 허용한 뒤 다시 시도해주세요.':'다른 앱에서 카메라를 사용 중인지 확인하고 다시 시도해주세요.');scanButton.disabled=false;scanButton.textContent='▣ 카메라 권한 다시 요청';}};
  showCameraNotice('카메라를 켜야 인증할 수 있어요','아래 버튼을 누르면 카메라 권한을 요청합니다.');scanButton.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();startLiveCamera();},true);window.addEventListener('pagehide',stopLiveCamera);
</script>
</body>
</html>
