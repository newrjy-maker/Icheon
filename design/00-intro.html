  <style>

    .hero{position:relative;z-index:3;padding:68px 24px 0;text-align:center}.hero h1{margin:0;font-size:32px;line-height:1.2;letter-spacing:-1.2px}.hero p{margin:10px 0 0;color:var(--mint);font-size:16px;font-weight:700}
    .jar-stage{position:relative;z-index:3;height:356px}.jar-button{position:absolute;left:50%;top:47%;width:244px;height:292px;border:0;background:transparent;transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 20px 22px rgba(0,0,0,.38))}.jar-button:focus-visible{outline:4px solid var(--orange);outline-offset:6px;border-radius:45%}.jar-button svg{width:100%;height:100%;animation:breathe 2.8s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-7px) scale(1.018)}}.jar-label{position:absolute;right:30px;top:52px;padding:7px 11px;border:1px solid var(--orange);border-radius:99px;background:#132a30;color:#fff;font-size:13px;font-weight:900}.jar-label b{color:var(--orange)}.origin{position:absolute;left:39px;bottom:20px;padding:6px 10px;border:1px solid rgba(115,224,215,.5);border-radius:99px;background:#11262c;color:#dcf9f7;font-size:12px;font-weight:900}
    .actions{position:relative;z-index:6;margin-top:-7px;padding:0 30px;text-align:center}.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border:1px solid #78e7de;border-radius:17px;background:linear-gradient(100deg,#159e98,#70ddd5);color:#fff;font-size:18px;font-weight:900;box-shadow:0 10px 25px rgba(32,182,173,.24);cursor:pointer}.actions p{margin:12px 0 0;color:var(--muted);font-size:13px;font-weight:700}.resume{display:inline-block;margin-top:10px;color:#9bded9;font-size:13px;font-weight:900;text-underline-offset:4px}footer{position:absolute;left:0;right:0;bottom:21px;text-align:center;color:#687d82;font-size:10px;font-weight:900;letter-spacing:.12em}
    @media(max-height:860px){.hero{padding-top:30px}.jar-stage{height:320px}.jar-button{width:220px;height:268px}.actions{margin-top:-13px}footer{bottom:8px}}
  </style>
